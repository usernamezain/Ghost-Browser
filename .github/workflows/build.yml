name: CI Build Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  RUSTC_WRAPPER: "sccache"
  SCCACHE_DIR: "${{ github.workspace }}/.sccache"

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # IMPORTANT TRADEOFF: Gecko/Firefox full builds typically take 1-3 hours.
    # GitHub Actions has a 6-hour job timeout. For public repos, minutes are unlimited
    # but the 6-hour job timeout could be tight for a cold Gecko build.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '21'
          cache: 'npm'
          cache-dependency-path: core/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3'

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
        
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Install MozillaBuild (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Invoke-WebRequest -Uri "https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe" -OutFile "MozillaBuildSetup.exe"
          Start-Process -FilePath ".\MozillaBuildSetup.exe" -ArgumentList "/S" -Wait
          echo "c:\mozilla-build\python\Scripts" >> $env:GITHUB_PATH
          echo "c:\mozilla-build\bin" >> $env:GITHUB_PATH

      - name: Configure Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: .sccache
          key: ${{ runner.os }}-sccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sccache-

      - name: Cache Gecko objdir
        uses: actions/cache@v4
        with:
          path: obj-*
          key: ${{ runner.os }}-gecko-objdir-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gecko-objdir-

      - name: npm install
        run: npm install
        working-directory: core

      - name: npm run init
        run: npm run init
        working-directory: core
        
      - name: npm run build
        run: npm run build
        working-directory: core

      - name: Upload Browser Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-browser-binary-${{ matrix.os }}
          path: |
            core/dist/
            core/out/
            core/obj-*/dist/bin/
