<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fingerprint Auditor</title>
  <style>
    :root {
      --bg-color: #000000;
      --fg-color: #ffffff;
    }
    body {
      background: var(--bg-color);
      color: var(--fg-color);
      font-family: monospace;
      margin: 20px;
      padding: 0;
    }
    h1 {
      text-transform: uppercase;
      border-bottom: 2px solid var(--fg-color);
      padding-bottom: 10px;
      font-size: 1.2rem;
      letter-spacing: 0.1em;
    }
    p {
      font-size: 0.9rem;
      margin-bottom: 20px;
    }
    .container {
      display: flex;
      flex-direction: column;
      max-width: 600px;
      gap: 10px;
    }
    button {
      background: var(--bg-color);
      color: var(--fg-color);
      border: 1px solid var(--fg-color);
      padding: 12px 15px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: monospace;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    button:hover {
      background: var(--fg-color);
      color: var(--bg-color);
    }
    button::before {
      content: "> ";
    }
  </style>
</head>
<body>
  <h1>Fingerprint Auditor</h1>
  <p>Select a test suite to launch in an isolated tab for footprint analysis:</p>
  <div class="container" id="button-container">
    <!-- Buttons dynamically injected via JS -->
  </div>
  <script src="chrome://zen/content/devtools/fingerprint-auditor.js"></script>
</body>
</html>
