<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Theme Marketplace</title>
    <style>
        :root {
            --bg-color: #000000;
            --fg-color: #ffffff;
            --accent-color: #444444;
            --border-color: #333333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--fg-color);
            font-family: 'Courier New', Courier, monospace; /* Minimalist */
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid var(--fg-color);
            padding-bottom: 10px;
            margin-bottom: 30px;
            width: 100%;
            max-width: 800px;
        }

        #theme-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 800px;
        }

        .theme-card {
            border: 1px solid var(--border-color);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0a0a0a;
            transition: background-color 0.3s;
        }

        .theme-card:hover {
            background-color: #1a1a1a;
        }

        .theme-info {
            display: flex;
            flex-direction: column;
        }

        .theme-name {
            font-size: 1.2em;
            font-weight: bold;
        }

        .theme-type {
            font-size: 0.9em;
            color: #888;
        }

        .apply-btn {
            background-color: var(--fg-color);
            color: var(--bg-color);
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .apply-btn:hover {
            background-color: #cccccc;
        }

        .progress-bar {
            width: 100%;
            height: 2px;
            background-color: transparent;
            margin-bottom: 20px;
            max-width: 800px;
            position: relative;
            overflow: hidden;
        }

        .progress-bar.active::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 30%;
            background-color: var(--fg-color);
            animation: loading 1.5s infinite ease-in-out;
        }

        @keyframes loading {
            0% { left: -30%; }
            100% { left: 100%; }
        }

    </style>
</head>
<body>
    <h1>Local Theme Marketplace</h1>
    <div class="progress-bar" id="progress-indicator"></div>
    <div id="theme-list">
        <!-- Rendered via JS -->
    </div>

    <!-- GSAP for animation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- Use type module to import the manager -->
    <script type="module" src="ghost-theme-marketplace.js"></script>
</body>
</html>
